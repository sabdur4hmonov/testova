<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish — Testova Admin</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-body-tertiary">
<div class="login-wrap">
  <div class="card shadow-sm login-card">
    <div class="card-body p-4">
      <h1 class="h4 mb-1 text-center">🧪 Testova Admin</h1>
      <p class="text-muted text-center mb-4">Boshqaruv paneli</p>

      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      {% if not enabled %}
        <div class="alert alert-warning py-2">
          Panel paroli hali o‘rnatilmagan. <code>.env</code> faylga
          <code>ADMIN_PASSWORD_HASH</code> qo‘shing:<br>
          <code>python -m app.admin.web.security '&lt;parol&gt;'</code>
        </div>
      {% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label">Login</label>
          <input name="username" class="form-control" autocomplete="username" autofocus
                 {% if not enabled %}disabled{% endif %}>
        </div>
        <div class="mb-3">
          <label class="form-label">Parol</label>
          <input name="password" type="password" class="form-control"
                 autocomplete="current-password" {% if not enabled %}disabled{% endif %}>
        </div>
        <button class="btn btn-primary w-100" type="submit"
                {% if not enabled %}disabled{% endif %}>Kirish</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
