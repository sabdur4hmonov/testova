version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Production stack: postgres + redis + bot ONLY.
#
# The Celery worker/beat/flower, the FastAPI admin API, and nginx were REMOVED
# on purpose:
#   - Celery is dead code (app.tasks.file_tasks ImportErrors) — the worker/beat
#     would crash-loop. Background work runs in-process (the exam timer is an
#     in-process APScheduler; extraction runs on the event loop's thread pool).
#   - The FastAPI admin (app.admin.main) is built on the dead subscription model
#     and was guarded only by a default secret — administration is done via the
#     in-bot admin commands (/grant, /stats, …) instead.
#   - nginx required TLS certs that are not shipped, and the bot runs in polling
#     mode, so no reverse proxy is needed.
# Reintroduce them only with their own review.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: testova_db
      POSTGRES_USER: testova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testova -d testova_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (FSM storage) ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Bot ────────────────────────────────────────────────────────────────────
  # NOTE: run `alembic upgrade head` BEFORE the first `up` of this service —
  # alembic is the single source of truth for the schema (see README/handoff).
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: python main.py
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
      # temp_images/ is a PERMANENT store: figure crops written at upload time
      # are read back by pdf_generator at every variant build. WITHOUT this
      # mount, a redeploy destroys teachers' figures (they print blank).
      - ./temp_images:/app/temp_images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://testova:${POSTGRES_PASSWORD:-strongpassword}@postgres:5432/testova_db
      - REDIS_URL=redis://redis:6379/0

volumes:
  postgres_data:
  redis_data:
